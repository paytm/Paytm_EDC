buildscript {
    ext.kotlin_version = '1.6.0'

    ext.versions = [
            'kotlin'        : '1.6.0',
            'minSdk'        : 24,
            'compileSdk'    : 31,
            'targetSdk'     : 31,
            'code'          : 4,
            'name'          : "1.1.1",
            'android_gradle': '7.2.2'
    ]
    ext.deps = [
            'kotlin_bom'   : "org.jetbrains.kotlin:kotlin-bom:${versions.kotlin}",
            'jssc'         : "io.github.java-native:jssc:2.9.4",
            'gson'         : "com.google.code.gson:gson:2.9.1",
            'core_ktx'     : "androidx.core:core-ktx:1.2.0",
            'appcompat'    : "androidx.appcompat:appcompat:1.3.0",
            'material'     : "com.google.android.material:material:1.4.0",
            'constarint'   : "androidx.constraintlayout:constraintlayout:2.1.4",
            'zxing'        : "com.google.zxing:core:3.3.0",
            'junit'        : "junit:junit:4.13.2",
            'junit_ext'    : "androidx.test.ext:junit:1.1.3",
            'espresso_core': "androidx.test.espresso:espresso-core:3.4.0"

    ]
}
// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '7.2.2' apply false
    id 'com.android.library' version '7.2.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.7.10' apply false
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}